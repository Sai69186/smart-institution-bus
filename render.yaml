## render.yaml — Campus Transit deployment manifest
## Place this file at the repo ROOT.
## Deploy via: Render Dashboard → New → Blueprint → connect this repo.
##
## Services:
##   1. campus-transit-api  — Node.js Express + Socket.io (rootDir: server)
##   2. campus-transit-ai   — Python Flask AI microservice (rootDir: python_services)

services:

  # ── 1. Node.js API ──────────────────────────────────────────────────────────
  - type: web
    name: campus-transit-api
    runtime: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: PYTHON_SERVICE_URL
        sync: false

  # ── 2. Python Flask AI Microservice ─────────────────────────────────────────
  # .pkl model files are NOT in git (rf_model is 311MB — over GitHub limit).
  # Build command installs deps then trains all models from the CSV datasets.
  # First deploy takes ~3-5 minutes to train. Subsequent deploys reuse cache.
  - type: web
    name: campus-transit-ai
    runtime: python
    region: oregon
    plan: free
    rootDir: python_services
    buildCommand: pip install -r requirements.txt && python models/train_models.py
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health
    envVars: []
